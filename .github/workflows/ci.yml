name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails the build if anything the app or the push function ships with (react, react-dom, web-push and what they pull in)
      # has a known vulnerability. Build and test tools are checked separately by hand; see README section 29.
      - run: npm audit --omit=dev
      - run: npx tsc --noEmit
      - run: npx tsc -p e2e/tsconfig.json
      - run: npm test
      - run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
